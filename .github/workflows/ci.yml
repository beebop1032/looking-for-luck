name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Run tests
        run: vendor/bin/phpunit

  static-analysis:
    name: Static analysis & coding standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: PHPStan (level max)
        run: vendor/bin/phpstan analyse --no-progress

      - name: php-cs-fixer
        run: vendor/bin/php-cs-fixer check --diff
        env:
          PHP_CS_FIXER_IGNORE_ENV: '1'

      - name: Composer audit
        run: composer audit

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t looking-for-luck .

      - name: Smoke test (CLI)
        run: docker run --rm looking-for-luck app:euromillions:predict 3 --offline

      - name: Smoke test (web)
        run: |
          docker run -d --name lfl -p 8080:8080 looking-for-luck
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8080/health && break; sleep 1; done
          curl -fsS -o /dev/null "http://127.0.0.1:8080/euromillions/generate?filter=0"
          curl -fsS -o /dev/null http://127.0.0.1:8080/
          docker exec lfl supercronic -test /app/docker/crontab
          docker rm -f lfl
