"lab.honest": "on the same history, the hot, cold and overdue strategies always play the same grids, so their score never changes. Now run “Random grid” a few times: its score jumps around, 20 %, then 70 %, with no method at all. The strategies land in that same range. It is luck, not method: every draw is independent."
