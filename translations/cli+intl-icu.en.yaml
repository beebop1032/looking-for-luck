"stats.chi_explain": "In plain language: this test compares the observed frequencies with what a perfectly random draw would produce. The p-value is the probability of seeing deviations at least this large if randomness is pure."
"stats.chi_high": "p-value ≥ 0.05: the gaps between “hot” and “cold” numbers are exactly what randomness produces. No number is favoured; past frequencies say nothing about future draws."
"stats.chi_low": "p-value < 0.05: the distribution would be unusual for a fair draw. Still possible: 5 % of perfectly random histories fall below this threshold out of sheer bad luck."
