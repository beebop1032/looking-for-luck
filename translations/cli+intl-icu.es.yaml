"stats.average": "media"
"stats.chi_explain": "En palabras sencillas: esta prueba compara las frecuencias observadas con lo que produciría un sorteo perfectamente aleatorio. El valor p es la probabilidad de ver desviaciones al menos así de grandes si el azar es puro."
"stats.chi_high": "valor p ≥ 0,05: las diferencias entre números «calientes» y «fríos» son exactamente lo que produce el azar. Ningún número está favorecido; las frecuencias pasadas no dicen nada de los sorteos futuros."
"stats.chi_low": "valor p < 0,05: la distribución sería inusual para un sorteo justo. Aun así es posible: el 5 % de los historiales perfectamente aleatorios cae por debajo de este umbral por pura mala suerte."
