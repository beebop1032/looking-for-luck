# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # Languages of the web interface (the first one is the fallback).
    app.locales: [en, fr, nl, es, de]
    # Where draws, saved grids and sync status are stored (a Docker volume in
    # production): each lottery uses <data root>/<slug>/.
    app.data_root: '%env(default:app.default_data_root:LFL_DATA_ROOT)%'
    app.default_data_root: '%kernel.project_dir%/var'
    # EuroMillions data, used by the app:euromillions:* commands.
    app.data_dir: '%app.data_root%/euromillions'

    # Public home of the project, linked from the web interface.
    app.repository_url: 'https://github.com/beebop1032/looking-for-luck'
    app.version: '%env(default:app.default_version:LFL_VERSION)%'
    app.default_version: 'dev'
    # Country whose mandatory gambling warning is shown (fr, be…); empty = from the browser language region.
    app.country: '%env(default:app.default_country:LFL_COUNTRY)%'
    app.default_country: ''
    # Where the web interface keeps "My grids": server (a file, shared by everyone who
    # opens the app: a personal install) or browser (a cookie per visitor: a public site).
    app.grids: '%env(default:app.default_grids:LFL_GRIDS)%'
    app.default_grids: 'server'
    # Google Analytics 4 measurement ID (G-…) of your own deployment. Empty = no analytics,
    # no consent banner. When set, nothing is loaded until the visitor accepts.
    app.ga4_id: '%env(default:app.default_ga4_id:LFL_GA4_ID)%'
    app.default_ga4_id: ''
    # Or a Google Tag Manager container (GTM-…), behind the same consent banner.
    app.gtm_id: '%env(default:app.default_gtm_id:LFL_GTM_ID)%'
    app.default_gtm_id: ''

    # On the roadmap, waiting for a contributor (shown in the web interface).
    app.planned_lotteries:
        - { name: 'Eurojackpot', region: '🇪🇺', issue: 4 }
        - { name: 'Powerball', region: '🇺🇸', issue: 2 }
        - { name: 'Mega Millions', region: '🇺🇸', issue: 3 }

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'
            # Built per lottery by LotteryRegistry, not shared services.
            - '../src/Lottery/Lottery.php'
            - '../src/Lottery/FileGridStorage.php'
            - '../src/Web/CookieGridStorage.php'

    # Must run before Symfony's resolver that would inject the raw {lottery} string.
    App\Web\LotteryValueResolver:
        tags:
            - { name: controller.argument_value_resolver, priority: 150 }

    # The EuroMillions grids of the command line and the scheduled sync: always on the server.
    App\Lottery\GridStore:
        factory: ['App\Lottery\GridStore', 'inDirectory']
        arguments: ['@App\Euromillions\EuromillionsGame', '%app.data_dir%']

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

when@test:
    services:
        test.http_client.not_found:
            class: App\Tests\Fixtures\NotFoundHttpResponder

    parameters:
        # Tests write their own fixtures here: never touch the real data.
        app.data_root: '%kernel.project_dir%/var/test-data'
