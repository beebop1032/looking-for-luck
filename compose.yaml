services:
  app:
    build: .
    image: looking-for-luck
    ports:
      - "${LFL_PORT:-8090}:8080"
    # Draw cache, saved grids and sync status survive restarts and rebuilds.
    volumes:
      - lottery-data:/data
    environment:
      # Optional: enables the AI assistant (app:euromillions:ask).
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # Optional: language of the command-line output (en, fr, nl, es, de).
      - LFL_LOCALE=${LFL_LOCALE:-}
      - LFL_COUNTRY=${LFL_COUNTRY:-}
      # Optional: your own Google Analytics 4 ID (G-…), with a consent banner.
      - LFL_GA4_ID=${LFL_GA4_ID:-}
    init: true
    restart: unless-stopped

volumes:
  lottery-data:
